<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html lists</title>
</head>
<body>
    

    <!-- Ordered List -->
    <h2>Alphabetic names of country</h2>
    <ol type="A">
        <li>Algeria</li>
        <li>Brazil</li>
        <li>Chille</li>
        <li>Dr congo</li>
        <li>Ethiopia</li>
        <li>France</li>
        <li>Germany</li>
        <li>Hungary</li>
        <li>India</li>
        <li>Japan</li>   
    </ol>


    <h1>Simple form</h1>

    <form action="">
        <label for="Name">Name:</label>
        <input type="text" id="Name" name="Name"><br><br>

        <label for="password">Password:</label>
        <input type="password" placeholder="input your password" id="password" name="password"><br><br>

        <label for="Age">Age:</label>
        <input type="number" placeholder="enter your Age in years" id="Age" name="Age"><br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date"><br><br>

        <label for="email">Email:</label>
        <input type="email" placeholder="input your email" id="email" name="email"><br><br>

        <input type="submit" value="Login">
    </form>
</body>
</html>
